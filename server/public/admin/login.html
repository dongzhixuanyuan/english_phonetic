<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - 用户反馈后台</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-header">
      <div class="admin-badge">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <h2>管理后台登录</h2>
      <p>用户反馈数据管理中心</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">管理员账号</label>
        <input type="text" id="username" name="username" class="input" placeholder="默认 admin" required autofocus>
      </div>

      <div class="form-group">
        <label for="password">登录密码</label>
        <input type="password" id="password" name="password" class="input" placeholder="默认 admin123" required>
      </div>

      <p class="error-msg" id="loginError"></p>

      <button type="submit" id="loginBtn" class="btn btn-primary">
        <span>立即登录</span>
      </button>
    </form>
    
    <div class="login-tips">
      <p>提示：如需修改账号密码，请编辑服务根目录下的 <code>.env</code> 文件</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 如果已经登录，直接跳到后台主页
      try {
        const res = await fetch('../api/admin/check-auth');
        const data = await res.json();
        if (data.authenticated) {
          window.location.replace('index.html');
          return;
        }
      } catch (e) {}

      const form = document.getElementById('loginForm');
      const errorMsg = document.getElementById('loginError');
      const loginBtn = document.getElementById('loginBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.textContent = '';
        loginBtn.disabled = true;
        loginBtn.querySelector('span').textContent = '登录中...';

        const username = form.username.value.trim();
        const password = form.password.value;

        try {
          const res = await fetch('../api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            window.location.replace('index.html');
          } else {
            errorMsg.textContent = data.message || '用户名或密码错误';
          }
        } catch (err) {
          errorMsg.textContent = '网络连接失败，请稍后再试';
        } finally {
          loginBtn.disabled = false;
          loginBtn.querySelector('span').textContent = '立即登录';
        }
      });
    });
  </script>
</body>
</html>
