<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>用户意见与反馈</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="feedback-container">
    <!-- 头部信息 -->
    <header class="header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
        </svg>
      </div>
      <h1 class="title">产品意见与反馈</h1>
      <p class="subtitle">您的每一条宝贵建议，都是我们不断完善产品的动力</p>
    </header>

    <!-- 反馈表单卡片 -->
    <main class="card" id="formCard">
      <form id="feedbackForm" novalidate>
        
        <!-- 反馈内容 -->
        <div class="form-group">
          <label for="content" class="label">
            反馈内容 <span class="required">*</span>
          </label>
          <div class="textarea-wrapper">
            <textarea
              id="content"
              name="content"
              class="textarea"
              rows="6"
              maxlength="2000"
              placeholder="请详细描述您遇到的问题、改进建议或想要的新功能..."
              required
            ></textarea>
            <div class="counter-wrapper">
              <span id="charCount">0</span>/2000
            </div>
          </div>
          <p class="error-msg" id="contentError"></p>
        </div>

        <!-- 联系方式 -->
        <div class="form-group">
          <label for="contact" class="label">
            联系方式 <span class="optional">(选填)</span>
          </label>
          <div class="input-wrapper">
            <input
              type="text"
              id="contact"
              name="contact"
              class="input"
              maxlength="100"
              placeholder="手机号 / 微信 / 邮箱（方便我们回复您）"
            >
          </div>
        </div>

        <!-- 提交按钮 -->
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">
            <span class="btn-text">提交反馈</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </form>
    </main>

    <!-- 提交成功卡片（默认隐藏） -->
    <main class="card success-card" id="successCard" style="display: none;">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="16 9 10 15 7 12"></polyline>
        </svg>
      </div>
      <h2 class="success-title">提交成功！</h2>
      <p class="success-desc">我们已收到您的反馈并会认真研读，感谢您对我们产品的支持与帮助。</p>
      <button type="button" id="resetBtn" class="btn btn-secondary">再提一条</button>
    </main>

    <!-- 页脚版权 -->
    <footer class="footer">
      <p>© 2026 English Phonetic 点读机. All rights reserved.</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
